<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectra Trail</title>
<style>
:root{--bg:#05060c;--panel:rgba(12,14,26,.78);--text:#e8eaf6;--muted:#8a90b0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
#gl,#ov{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#gl{cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}
#ov{pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;backdrop-filter:blur(6px)}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.active{border-color:#fff}
#clock{font-variant-numeric:tabular-nums;min-width:62px;text-align:center;cursor:default}
#scrub{flex:1;min-width:140px;accent-color:#b46bff}
#events{position:fixed;right:10px;top:96px;width:270px;max-height:calc(100vh - 210px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
#events h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ev{padding:5px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev.dim{opacity:.35}
.ev b{display:block;font-weight:600}
.ev small{color:var(--muted)}
.chips{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.chip{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid currentColor}
#spectrum{position:fixed;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(6px)}
.cell{position:relative;height:64px;border-radius:6px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.04);border-top:3px solid var(--c)}
.cell .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.35}
.cell .lbl{position:absolute;left:8px;top:6px;right:6px}
.cell .lbl b{display:block;font-size:13px}
.cell .lbl small{color:var(--muted);font-size:10px}
.cell.off{opacity:.3}
.cell.off .lbl b{text-decoration:line-through}
#hint{position:fixed;left:16px;bottom:86px;color:var(--muted);font-size:11px;text-shadow:0 1px 2px #000}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media (max-width:760px){#events{display:none}.cell .lbl small{display:none}.cell{height:48px}#hint{bottom:68px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading">Building the mountains…</div>
<canvas id="ov"></canvas>
<div id="flash"></div>
<div id="top">
  <button class="btn" id="play">❚❚ Pause</button>
  <span class="btn" id="clock">19:30</span>
  <input type="range" id="scrub" min="0" max="120" step="0.01" value="0">
  <span id="presets"></span>
  <button class="btn active" id="labels">Labels</button>
</div>
<div id="events"><h3>Now happening</h3><div id="evlist"></div></div>
<div id="hint">Drag to look ahead and up (a quarter sphere, you can't turn behind yourself) · scroll to zoom · click a band or press 1–7 to filter · space = play/pause · the walk lasts 2 minutes</div>
<div id="spectrum"></div>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// Helpers
// =====================================================================
const V3 = THREE.Vector3, DEG = Math.PI / 180, D = 8000;  // D = distance of the "celestial sphere"
const deg = d => D * d * DEG;                             // angular size (deg) -> world size at D
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const env = (t, t0, t1, f = 1.5) => sm(t0, t0 + f, t) * (1 - sm(t1 - f, t1, t));
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(42);
function kf(keys, t) { // [[t, [r,g,b], [r,g,b]...]] -> interpolated arrays
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1], k = clamp((t - a[0]) / (b[0] - a[0]));
  return a.slice(1).map((c, j) => c.map((v, m) => lerp(v, b[j + 1][m], k)));
}
function hash2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, y, o = 5) { let a = 0, w = .5; for (let i = 0; i < o; i++) { a += w * noise2(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 3.7; w *= .5; } return a; }
function ridged2(x, y, o = 6) { let a = 0, w = .5; for (let i = 0; i < o; i++) { a += w * (1 - Math.abs(2 * noise2(x, y) - 1)); x = x * 2.1 + 5.3; y = y * 2.1 + 11.9; w *= .5; } return a; }
// sky direction: azimuth from north (+x) clockwise through east (+z); elevation above horizon
const dirAE = (az, el) => new V3(Math.cos(el * DEG) * Math.cos(az * DEG), Math.sin(el * DEG), Math.cos(el * DEG) * Math.sin(az * DEG));
const skyP = (az, el) => dirAE(az, el).multiplyScalar(D).add(camera.position);
const onSky = dir => dir.clone().normalize().multiplyScalar(D).add(camera.position);
function basis(dir) { const u = new V3().crossVectors(dir, new V3(0, 1, 0)).normalize(); const v = new V3().crossVectors(u, dir).normalize(); return [u, v]; }
const ringPts = (dir, radDeg, n = 48) => { const [u, v] = basis(dir); return Array.from({ length: n + 1 }, (_, i) => { const a = i / n * Math.PI * 2; return onSky(dir.clone().add(u.clone().multiplyScalar(Math.cos(a) * radDeg * DEG)).add(v.clone().multiplyScalar(Math.sin(a) * radDeg * DEG))); }); };
const linePts = (a, b, n = 12) => Array.from({ length: n }, (_, i) => a.clone().lerp(b, i / (n - 1)));

// =====================================================================
// Bands & state
// =====================================================================
const BANDS = [
  { id: 'radio', name: 'Radio',       range: '> 1 m',          color: '#ff4fd8' },
  { id: 'micro', name: 'Microwave',   range: '1 mm – 1 m',     color: '#ffa62b' },
  { id: 'ir',    name: 'Infrared',    range: '700 nm – 1 mm',  color: '#ff4a1c' },
  { id: 'vis',   name: 'Visible',     range: '380 – 700 nm',   color: '#ffffff' },
  { id: 'uv',    name: 'Ultraviolet', range: '10 – 380 nm',    color: '#b46bff' },
  { id: 'xray',  name: 'X-ray',       range: '0.01 – 10 nm',   color: '#5ff4ff' },
  { id: 'gamma', name: 'Gamma',       range: '< 0.01 nm',      color: '#7dff5a' },
];
const BI = Object.fromEntries(BANDS.map((b, i) => [b.id, i]));
const BAND = Object.fromEntries(BANDS.map(b => [b.id, b]));
const on = Object.fromEntries(BANDS.map(b => [b.id, true]));
const act = {}, meter = Object.fromEntries(BANDS.map(b => [b.id, 0]));
const PRESETS = {
  'All': BANDS.map(b => b.id), 'Human eye': ['vis'],
  'Invisible only': ['radio', 'micro', 'ir', 'uv', 'xray', 'gamma'],
  'Thermal': ['ir', 'micro'], 'Radio telescope': ['radio', 'micro'], 'High energy': ['uv', 'xray', 'gamma'],
};
let t = 0, T = 0, playing = true, labelsOn = true, lastEv = '', visMode = true;
let yaw = 0, pitch = .06;   // yaw 0 = looking west (-z), down the trail
const TIME = { value: 0 };

// =====================================================================
// Renderer / scene / post
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .42;
renderer.domElement.id = 'gl'; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, .0001);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, .2, 40000);
camera.rotation.order = 'YXZ'; scene.add(camera);

const rt = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .3, .9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// =====================================================================
// Shaders for the band "special effects"
// =====================================================================
const COMMON = `
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=0., w=.5; for(int i=0;i<6;i++){ a+=w*n2(p); p=p*2.03+vec2(1.7,9.2); w*=.5; } return a; }
vec3 hsv(float h){ return clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.); }
vec3 thermal(float x){
  vec3 c = mix(vec3(.12,0.,.3), vec3(.9,.08,.12), smoothstep(0.,.35,x));
  c = mix(c, vec3(1.,.62,0.), smoothstep(.35,.7,x));
  return mix(c, vec3(1.,1.,.85), smoothstep(.7,1.,x)); }
`;
const QUAD_VS = `uniform float uSize; varying vec2 vUv;
void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(0.,0.,0.,1.); mv.xy += position.xy * uSize; gl_Position = projectionMatrix * mv; }`;
const QUAD_FS = COMMON + `
uniform int uBand; uniform float uI, uTime, uSeed, uReal; uniform vec3 uColor; varying vec2 vUv;
void main(){
  vec2 p = vUv*2.-1.; float r = length(p), a = atan(p.y,p.x), T = uTime + uSeed*10.; vec3 col = vec3(0.);
  if(uBand==0){            // RADIO: expanding concentric rings
    float ph = fract(r*2.5 - T*.8);
    float ring = smoothstep(0.,.06,ph)*smoothstep(.18,.06,ph)*smoothstep(1.,.35,r);
    col = hsv(.87+.03*sin(T*2.))*ring*1.3 + vec3(1.,.3,.85)*exp(-r*r*45.)*2.;
  } else if(uBand==1){     // MICROWAVE: crackling pixel noise
    vec2 g = floor(p*13.); float m = step(.8, h21(g + floor(T*12.))) * smoothstep(1.,.15,r);
    col = mix(vec3(1.,.42,0.), vec3(1.,.85,.2), h21(g*1.7))*m*1.6 + vec3(1.,.5,0.)*exp(-r*r*9.)*.5;
  } else if(uBand==2){     // INFRARED
    if(uReal > .5){        // moving warm bodies: tight, low-contrast heat that rises, no false-colour rings
      vec2 q = p*vec2(1.15,.95); float rr = length(q);
      float body = exp(-rr*rr*5.5);
      float rise = smoothstep(-.15,.8,p.y)*exp(-rr*rr*1.8)*.45;
      float pulse = .85 + .15*sin(T*2.4 + uSeed*4.);
      col = (mix(vec3(1.,.5,.14), vec3(.8,.84,.95), .35)*body + vec3(1.,.62,.24)*rise)*.85*pulse;
    } else {               // static / hot sources: thermal-camera palette
      float rr = r*(1.+.08*sin(a*5.+T*6.)+.05*sin(T*9.)); float x = clamp(1.-rr,0.,1.);
      col = thermal(x)*smoothstep(1.,.55,rr)*1.4;
    }
  } else if(uBand==3){     // VISIBLE: plain light
    col = uColor*(exp(-r*r*22.)*2.6 + exp(-r*5.)*.35)*smoothstep(1.,.6,r);
  } else if(uBand==4){     // ULTRAVIOLET: violet glow + rotating rays
    float rays = pow(abs(cos(a*3.+T*1.5)),30.)*smoothstep(1.,.1,r);
    col = vec3(.62,.3,1.)*(exp(-r*r*10.)*2. + rays*1.3);
  } else if(uBand==5){     // X-RAY: flickering cyan scanlines
    float rowi = floor(vUv.y*40.); float lines = step(.5, fract(vUv.y*40. + T*2.));
    float flick = .55+.45*h21(vec2(rowi, floor(T*20.)));
    col = vec3(.45,1.,1.)*lines*flick*smoothstep(.95,.45,r)*1.2 + vec3(.8,1.,1.)*exp(-r*r*30.)*2.;
  } else {                 // GAMMA: hue-cycling jagged starburst
    float s1 = pow(abs(sin(a*7.+floor(T*15.)*1.7)),40.), s2 = pow(abs(sin(a*11.-floor(T*15.)*2.3)),60.);
    col = hsv(fract(T*1.1))*(s1+s2)*smoothstep(1.,0.,r)*1.6 + hsv(fract(T*1.1+.33))*exp(-r*r*20.)*2.6;
  }
  gl_FragColor = vec4(col*uI, 1.);
}`;
const RIB_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`;
const RIB_FS = COMMON + `
uniform int uBand; uniform float uI, uTime, uSeed, uLen, uFade, uReal; uniform vec3 uColor; varying vec2 vUv;
void main(){
  float u = vUv.x, v = vUv.y, d = abs(v), T = uTime + uSeed*7.; vec3 c = vec3(0.);
  if(uBand==0){ float dash = step(.45, fract(u*uLen*.12 - T*1.5)); c = vec3(1.,.31,.85)*dash*exp(-d*d*5.)*1.4; }
  else if(uBand==1){ vec2 g = floor(vec2(u*uLen*.5, v*2.5)); c = mix(vec3(1.,.45,0.),vec3(1.,.85,.2),h21(g*1.7))*step(.72,h21(g+floor(T*12.)))*1.5*(1.-d*.5); }
  else if(uBand==2){ if(uReal > .5){ float hh = 1.-clamp(abs(v)*1.4,0.,1.); c = mix(vec3(1.,.5,.14), vec3(.82,.86,.96), .4)*hh*hh*.42; }
    else { float x = 1.-d; c = thermal(x*(.9+.1*sin(T*7.+u*20.)))*smoothstep(0.,.3,x)*1.3; } }  else if(uBand==3){ c = uColor*(exp(-d*d*6.)*1.4 + exp(-d*d*40.)*1.); }
  else if(uBand==4){ c = vec3(.62,.3,1.)*(exp(-d*d*4.)*1.2 + exp(-d*d*40.)*1.2); }
  else if(uBand==5){ float off = (h21(vec2(floor(u*uLen*.6), floor(T*20.)))-.5)*.9; c = vec3(.5,1.,1.)*exp(-pow((v-off)*5.,2.))*1.7; }
  else { float off = (h21(vec2(floor(u*uLen*.8), floor(T*15.)))-.5)*1.2; c = hsv(fract(T*1.1+u))*exp(-pow((v-off)*3.,2.))*1.7; }
  gl_FragColor = vec4(c*uI*mix(1., u, uFade), 1.);
}`;
function bandMat(band, color, ribbon, real) {
  return new THREE.ShaderMaterial({
    uniforms: { uBand: { value: BI[band] }, uI: { value: 0 }, uTime: TIME, uSeed: { value: Math.random() }, uSize: { value: 1 }, uReal: { value: real ? 1 : 0 },
      uColor: { value: new THREE.Color(color || '#ffffff') }, uLen: { value: 1 }, uFade: { value: 0 } },
    vertexShader: ribbon ? RIB_VS : QUAD_VS, fragmentShader: ribbon ? RIB_FS : QUAD_FS,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
}

// Point source (camera-facing glow drawn in its band's style)
const EMS = [], RIBS = [], quadGeo = new THREE.PlaneGeometry(1, 1);
class Em {
  constructor(band, color, real) { this.band = band; this.m = new THREE.Mesh(quadGeo, bandMat(band, color, false, real)); this.m.frustumCulled = false; this.m.renderOrder = 5; scene.add(this.m); EMS.push(this); }
  set(pos, size, I) {
    if (!(I > .01)) return this;
    act[this.band] += I;
    const u = this.m.material.uniforms; this.m.position.copy(pos); u.uSize.value = size; u.uI.value = I * GAIN[this.band];
    this.m.visible = on[this.band]; return this;
  }
}
// Path source (camera-facing ribbon drawn in its band's style); points ordered so fade grows toward the end
class Rib {
  constructor(band, color, maxN = 32, real = 0) {
    this.band = band; this.max = maxN;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(maxN * 6), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(maxN * 4), 2));
    const idx = []; for (let i = 0; i < maxN - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setIndex(idx);
    this.m = new THREE.Mesh(g, bandMat(band, color, true, real)); this.m.frustumCulled = false; this.m.renderOrder = 5; scene.add(this.m); RIBS.push(this);
  }
  set(pts, w0, w1, I, fade = 0) {
    if (!(I > .01) || pts.length < 2) return this;
    act[this.band] += I * .5;
    const n = Math.min(pts.length, this.max), pos = this.m.geometry.attributes.position, uv = this.m.geometry.attributes.uv;
    let total = 0; const cum = [0];
    for (let i = 1; i < n; i++) { total += pts[i].distanceTo(pts[i - 1]); cum.push(total); }
    const tg = new V3(), vw = new V3(), sd = new V3();
    for (let i = 0; i < n; i++) {
      tg.subVectors(pts[Math.min(n - 1, i + 1)], pts[Math.max(0, i - 1)]);
      vw.subVectors(camera.position, pts[i]);
      sd.crossVectors(tg, vw).normalize().multiplyScalar(lerp(w0, w1, i / (n - 1)) / 2);
      pos.setXYZ(i * 2, pts[i].x + sd.x, pts[i].y + sd.y, pts[i].z + sd.z);
      pos.setXYZ(i * 2 + 1, pts[i].x - sd.x, pts[i].y - sd.y, pts[i].z - sd.z);
      const u = total ? cum[i] / total : 0; uv.setXY(i * 2, u, 1); uv.setXY(i * 2 + 1, u, -1);
    }
    pos.needsUpdate = uv.needsUpdate = true;
    this.m.geometry.setDrawRange(0, (n - 1) * 6);
    const U = this.m.material.uniforms; U.uI.value = I * GAIN[this.band]; U.uFade.value = fade; U.uLen.value = total / Math.max(1e-3, (w0 + w1) / 2);
    this.m.visible = on[this.band]; return this;
  }
}

// =====================================================================
// Sky (physically based scattering), night sky shader, clouds
// =====================================================================
const sky = new Sky(); sky.scale.setScalar(20000); sky.renderOrder = -10; scene.add(sky);
const SU = sky.material.uniforms;
SU.turbidity.value = 10; SU.rayleigh.value = 1.1; SU.mieCoefficient.value = .0006; SU.mieDirectionalG.value = .96;
SU.uFade = { value: 1 };
sky.material.fragmentShader = 'uniform float uFade;\n' + sky.material.fragmentShader.replace('gl_FragColor = vec4( retColor, 1.0 );', 'gl_FragColor = vec4( retColor * uFade, 1.0 );');

const GAIN = { radio: 1.9, micro: 2.0, ir: 1.6, vis: 1, uv: 1.9, xray: 2.1, gamma: 1.9 }; // instrument gain: invisible-band sources are brighter than visible ones
const GAL_C = dirAE(215, 20), GAL_N = new V3().crossVectors(GAL_C, dirAE(250, 80)).normalize(); // galactic centre ahead-left, band arching overhead
const nightMat = new THREE.ShaderMaterial({
  uniforms: { uTime: TIME, uStars: { value: 0 }, uMW: { value: 0 }, uCMB: { value: 0 }, uAir: { value: 0 }, uGalN: { value: GAL_N }, uGalC: { value: GAL_C } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: COMMON + `
  varying vec3 vDir; uniform float uTime, uStars, uMW, uCMB, uAir; uniform vec3 uGalN, uGalC;
  float h31(vec3 p){ p = fract(p*.3183099+.1); p *= 17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
    return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y), f.z); }
  float fbm3(vec3 p){ float a=0., w=.5; for(int i=0;i<5;i++){ a+=w*n3(p); p*=2.03; w*=.5; } return a; }
  vec3 stars(vec3 d, float scale, float dens, float boost){
    vec3 p = d*scale, c = floor(p), f = fract(p);
    float h = h31(c); if(h > dens) return vec3(0.);

  h -= (1 - sm(0, 2.5, Math.abs(x - trailX(z)))) * .25;     // worn trail

// =====================================================================
// Per-frame world update
// =====================================================================
function updateWorld() {
  const n = sm(8, 22, t), ml = sm(38, 50, t), el = sunEl();
  // walk along the trail: 42 m -> -40 m over the minute
  const z = 42 - t * 2.74, x = trailX(z), bob = Math.sin(t * 9) * .03;
  camera.position.set(x, heightAt(x, z) + 1.7 + bob, z);
  camera.rotation.set(pitch, yaw, 0);

  // sky & atmosphere
  sky.position.copy(camera.position); nightSky.position.copy(camera.position);
  clouds.position.set(camera.position.x, 2400, camera.position.z);
  SU.sunPosition.value.copy(dirAE(SUN_AZ, Math.max(el, -2.5)));
  SU.uFade.value = 1 - sm(12, 28, t);
  nightMat.uniforms.uStars.value = on.vis ? n * (1 - .4 * ml) : 0; act.vis += n * .2;
  nightMat.uniforms.uAir.value = on.vis ? n * (1 + 2 * ml) : 0;
  const [lit, shade] = kf(CLOUD, t);
  cloudMat.uniforms.uLit.value.setRGB(lit[0] + .05 * ml, lit[1] + .055 * ml, lit[2] + .07 * ml); cloudMat.uniforms.uShade.value.setRGB(...shade);
  cloudMat.uniforms.uCover.value = lerp(.5, .66, sm(14, 30, t));
  const hor = kf(HOR, t)[0]; scene.fog.color.setRGB(on.vis ? hor[0] + .02 * ml : 0, on.vis ? hor[1] + .025 * ml : 0, on.vis ? hor[2] + .04 * ml : 0);
  act.vis += 1 - sm(5, 20, t);

  // lights
  const sd = dirAE(SUN_AZ, el); sunLight.position.copy(camera.position).addScaledVector(sd, 1000); sunLight.target.position.copy(camera.position);
  sunLight.intensity = 1.4 * sm(-1, 6, el); sunLight.color.setRGB(1, lerp(.24, .55, sm(0, 9, el)), lerp(.09, .3, sm(0, 9, el)));
  const [hs, hg] = kf(HEMI, t); hemi.color.setRGB(hs[0], hs[1] + .01 * ml, hs[2] + .03 * ml); hemi.groundColor.setRGB(...hg);
  renderer.toneMappingExposure = lerp(.42, 1.1, n);

  // events
  EV.forEach(e => e.update && e.update());
}

// Visible light filtered out -> dark "instrument view": topo terrain, no sky
function applyVisMode() {
  if (visMode === on.vis) return; visMode = on.vis;
  sky.visible = clouds.visible = on.vis;
  terrain.material = on.vis ? terrainMat : topoMat;
  const lineMat = new THREE.LineBasicMaterial({ color: 0x3a4a8a });
  SOLIDS.forEach(o => o.material = on.vis ? o.userData.orig : (o.isLine ? lineMat : darkMat));
  VIS_ONLY.forEach(o => o.visible = on.vis);
}

const ov = document.getElementById('ov'), octx = ov.getContext('2d');
function sizeOverlay() { ov.width = innerWidth * PR; ov.height = innerHeight * PR; octx.setTransform(PR, 0, 0, PR, 0, 0); }
sizeOverlay();
function drawOverlay(active) {
  const W = innerWidth, H = innerHeight; octx.clearRect(0, 0, W, H);
  // compass
  const fwd = new V3(); camera.getWorldDirection(fwd); const head = (Math.atan2(fwd.z, fwd.x) / DEG + 360) % 360;
  const cx = W / 2, cy = 62, half = 170;
  octx.font = '11px system-ui'; octx.textAlign = 'center'; octx.fillStyle = 'rgba(12,14,26,.6)'; octx.fillRect(cx - half - 10, cy - 13, half * 2 + 20, 26);
  const NAMES = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
  for (let a = 0; a < 360; a += 15) {
    let d = ((a - head + 540) % 360) - 180; if (Math.abs(d) > 60) continue; const x = cx + d / 60 * half;
    octx.fillStyle = 'rgba(232,234,246,.8)'; octx.fillRect(x, cy + 4, 1, NAMES[a] ? 6 : 3);
    if (NAMES[a]) { octx.fillStyle = a === 0 ? '#ff8a8a' : '#e8eaf6'; octx.fillText(NAMES[a], x, cy); }
  }
  octx.fillStyle = '#b46bff'; octx.beginPath(); octx.moveTo(cx - 5, cy + 13); octx.lineTo(cx + 5, cy + 13); octx.lineTo(cx, cy + 8); octx.fill();
  if (!labelsOn) return;
  const right = W > 760 ? W - 300 : W - 30, v = new V3();
  for (const e of active) {
    const p = e.where && e.where(); if (!p) continue;
    if (!e.bands.some(b => on[b])) continue;
    v.copy(p).project(camera);
    let sx = (v.x * .5 + .5) * W, sy = (-v.y * .5 + .5) * H; const behind = v.z > 1;
    const col = BAND[e.bands[0]].color;
    if (!behind && sx > 30 && sx < right && sy > 90 && sy < H - 110) {
      octx.fillStyle = 'rgba(0,0,0,.55)'; const w = octx.measureText(e.name).width + 10; octx.fillRect(sx - w / 2, sy + 14, w, 15);
      octx.fillStyle = '#e8eaf6'; octx.fillText(e.name, sx, sy + 25);
    } else {
      if (behind) { sx = W - sx; sy = H - sy; }
      const ang = Math.atan2(sy - H / 2, sx - W / 2), dx = Math.cos(ang), dy = Math.sin(ang);
      const kx = dx > 0 ? (right - 20 - W / 2) / dx : (30 - W / 2) / dx, ky = dy > 0 ? (H - 120 - H / 2) / dy : (100 - H / 2) / dy, k = Math.min(Math.abs(kx), Math.abs(ky));
      const ax = W / 2 + dx * k, ay = H / 2 + dy * k;
      octx.save(); octx.translate(ax, ay); octx.rotate(ang); octx.fillStyle = col; octx.beginPath(); octx.moveTo(9, 0); octx.lineTo(-5, -6); octx.lineTo(-5, 6); octx.fill(); octx.restore();
      octx.fillStyle = 'rgba(0,0,0,.55)'; const w = octx.measureText(e.name).width + 10, lx = clamp(ax - dx * 14, w / 2 + 4, W - w / 2 - 4), ly = ay - dy * 16;
      octx.fillRect(lx - w / 2, ly - 10, w, 15); octx.fillStyle = '#e8eaf6'; octx.fillText(e.name, lx, ly + 1);
    }
  }
}

// =====================================================================
// UI
// =====================================================================
const spec = document.getElementById('spectrum');
BANDS.forEach((b, i) => {
  const c = document.createElement('div'); c.className = 'cell'; c.id = 'cell-' + b.id;
  c.style.setProperty('--c', b.id === 'vis' ? 'linear-gradient(90deg,#f44,#fa0,#ff4,#4f4,#4af,#a4f)' : b.color);
  if (b.id === 'vis') c.style.borderImage = 'linear-gradient(90deg,#f44,#fa0,#ff4,#4f4,#4af,#a4f) 1';
  c.innerHTML = `<div class="fill"></div><div class="lbl"><b>${i + 1} · ${b.name}</b><small>${b.range}</small></div>`;
  c.onclick = () => toggle(b.id); spec.appendChild(c);
});
const pre = document.getElementById('presets');
Object.entries(PRESETS).forEach(([name, ids]) => {
  const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = name; btn.style.marginRight = '4px';
  btn.onclick = () => { BANDS.forEach(b => on[b.id] = ids.includes(b.id)); syncUI(); }; pre.appendChild(btn);
});
function toggle(id) { on[id] = !on[id]; syncUI(); }
function syncUI() {
  BANDS.forEach(b => document.getElementById('cell-' + b.id).classList.toggle('off', !on[b.id]));
  [...pre.children].forEach(btn => { const ids = PRESETS[btn.textContent]; btn.classList.toggle('active', BANDS.every(b => on[b.id] === ids.includes(b.id))); });
  applyVisMode(); lastEv = '';
}
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), labBtn = document.getElementById('labels');
const setPlay = p => { playing = p; playBtn.textContent = p ? '❚❚ Pause' : '▶ Play'; };
playBtn.onclick = () => setPlay(!playing);
scrub.oninput = () => { t = +scrub.value / 2; };
labBtn.onclick = () => { labelsOn = !labelsOn; labBtn.classList.toggle('active', labelsOn); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  const k = +e.key; if (k >= 1 && k <= 7) toggle(BANDS[k - 1].id);
  if (e.key === 'ArrowLeft') yaw = clamp(yaw + .08, -1.35, 1.35); if (e.key === 'ArrowRight') yaw = clamp(yaw - .08, -1.35, 1.35);
  if (e.key === 'ArrowUp') pitch = clamp(pitch + .06, -.1, 1.5); if (e.key === 'ArrowDown') pitch = clamp(pitch - .06, -.1, 1.5);
});
// drag to look (full 360° yaw, from slightly below the horizon up to the zenith)
const gl = renderer.domElement; let drag = null;
gl.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; gl.setPointerCapture(e.pointerId); });
gl.addEventListener('pointermove', e => { if (!drag) return; const s = camera.fov / 65 * .0042;
  yaw = clamp(yaw + (e.clientX - drag.x) * s, -1.35, 1.35); pitch = clamp(pitch + (e.clientY - drag.y) * s, -.1, 1.5); drag = { x: e.clientX, y: e.clientY }; });
gl.addEventListener('pointerup', () => drag = null);
gl.addEventListener('wheel', e => { e.preventDefault(); camera.fov = clamp(camera.fov + e.deltaY * .03, 20, 90); camera.updateProjectionMatrix(); }, { passive: false });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); sizeOverlay();
});

function updateEvents(active) {
  const key = active.map(e => e.name).join('|'); if (key === lastEv) return; lastEv = key;
  document.getElementById('evlist').innerHTML = active.map(e => `<div class="ev ${e.bands.some(b => on[b]) ? '' : 'dim'}"><b>${e.name}</b><small>${e.note}</small><div class="chips">${
    e.bands.map(b => `<span class="chip" style="color:${BAND[b].color};opacity:${on[b] ? 1 : .35}">${BAND[b].name}</span>`).join('')}</div></div>`).join('');
}

// =====================================================================
// Loop
// =====================================================================
syncUI();
document.getElementById('loading').remove();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  T = now / 1000; TIME.value = T;
  if (playing) { t += dt * .5; if (t > 60) t = 0; scrub.value = t * 2; }
  BANDS.forEach(b => act[b.id] = 0);
  EMS.forEach(e => e.m.visible = false); RIBS.forEach(r => r.m.visible = false);
  updateWorld();
  composer.render();
  const active = EV.filter(e => t >= e.t0 && t <= e.t1);
  drawOverlay(active); updateEvents(active);
  BANDS.forEach(b => { meter[b.id] = lerp(meter[b.id], clamp(act[b.id] / ({ radio: 5.5, micro: 1.6, ir: 2.1, vis: 3.6, uv: 2.1, xray: 1.7, gamma: 3.4 })[b.id]), .15); document.querySelector(`#cell-${b.id} .fill`).style.height = (meter[b.id] * 100) + '%'; });   // raised radio/gamma tops: those events now carry many more sources
  const hrs = 19.5 + t / 60 * 4;
  document.getElementById('clock').textContent = `${Math.floor(hrs)}:${String(Math.floor((hrs % 1) * 60)).padStart(2, '0')}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
