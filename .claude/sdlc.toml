# .claude/sdlc.toml — the SDLC adapter values of this repository: the ONE home of names, paths and the
# mission/task standard. Read by `.claude/lib/sdlc.py` (mission-tracker and ship clis) and the git_guard hook.
# The flow they implement is `.claude/sdlc.md`; the conventions are `.claude/rules/missions.md`.

[repo]
main_branch = "main"            # the only long-lived branch: missions branch off it and merge back into it

[branches]
mission_prefix = "mission/"     # mission/M<N>-<slug>, off main, one per mission
worktrees_dir = ".claude/worktrees"  # worktree of a branch = <worktrees_dir>/<branch with / -> ->

[store]
missions_dir = ".claude/missions"    # M<N>-<slug>/mission.md + tasks/T<N>-<slug>.md — ONLY on mission branches, never on main
reserved_numbers = [0, 6]            # M0/M6: phases of the retired improvement plan, done before missions existed
templates_dir = ".claude/templates"  # mission.md, task.md
ref_pattern = 'refs M\d+(/T\d+)?'    # every commit on a mission branch carries `(refs M<N>/T<N>)`
no_mission_token = "[no-mission]"    # a commit straight on main, only when the user says so

[ship]
state_dir = ".claude/logs"      # review-M<N>.json verdict records, in the main checkout (git-ignored)
merge = "--no-ff"               # a delivery is one merge commit on main: `git log --first-parent main`
timeline_gate = ["uv", "run", "spectra", "timeline"]  # must print 0 warning(s) in the worktree before a merge

[standard.mission]
statuses = ["proposed", "planned", "active"]  # delivered = merged + branch deleted (no status)
required_meta = ["id", "title", "status", "branch", "created"]
sections = ["Problem", "Scope", "Delivery", "Current state", "Key decisions", "Tasks", "Log"]

[standard.task]
statuses = ["backlog", "in-progress", "done"]
labels = ["needs-verification", "needs-decision", "blocked", "gap", "bug"]
required_meta = ["id", "title", "status", "labels"]
sections = ["Goal", "Plan", "Acceptance", "Outcome"]
optional_sections = ["Notes"]   # allowed between Acceptance and Outcome
