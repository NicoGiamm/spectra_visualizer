<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectra Visualizer</title>
<!-- generated by `uv run spectra build` from engine/ui/landing.html; edit the template, not the output -->
<style>
:root{--bg:#05060c;--panel:rgba(18,20,36,.9);--text:#e8eaf6;--muted:#8a90b0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 120%,#3a1640 0%,#0b0b1c 45%,var(--bg) 80%);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:48px 16px}
main{max-width:860px;margin:0 auto}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.01em}
p.lede{margin:0 0 28px;color:var(--muted);max-width:60ch}
.bands{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:0 0 28px;max-width:420px}
.bands i{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
.card b{display:block;font-size:17px;margin-bottom:4px}
.card span{color:var(--muted);font-size:13px}
footer{margin-top:32px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<h1>Spectra Visualizer</h1>
<p class="lede">Two minutes from sunset to night, with events emitting from radio to gamma rays. Pick a place, then filter bands to see what your eyes miss.</p>
<div class="bands"><i style="background:#ff4fd8"></i><i style="background:#ffa62b"></i><i style="background:#ff4a1c"></i><i style="background:linear-gradient(90deg,#f44,#fa0,#ff4,#4f4,#4af,#a4f)"></i><i style="background:#b46bff"></i><i style="background:#5ff4ff"></i><i style="background:#7dff5a"></i></div>
<div class="grid">
<!--CARDS-->
</div>
<footer>Needs a network connection (three.js loads from a CDN) and WebGL.</footer>
</main>
</body>
</html>
