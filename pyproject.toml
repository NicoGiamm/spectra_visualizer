[project]
name = "spectra-visualizer"
version = "0.2.0"
description = "First-person 3D scenes with events emitting across the electromagnetic spectrum; Python tooling to serve, bundle and screenshot them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.25.3",
]

[project.scripts]
spectra = "spectra_tools.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spectra_tools"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long strings and comments stay readable

[tool.ty.environment]
python-version = "3.11"
extra-paths = [".claude/lib"]  # the SDLC clis and hooks import sdlc from there
